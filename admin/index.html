<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VE Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0f1527;
      color: #ffffff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .admin-msg {
      max-width: 760px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(184, 150, 62, 0.35);
      border-radius: 14px;
      padding: 22px;
      line-height: 1.65;
    }

    .admin-msg h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      color: #d4b96a;
    }

    .admin-msg p {
      margin: 8px 0;
      color: rgba(255, 255, 255, 0.9);
    }

    .admin-msg ol {
      margin: 10px 0 0 20px;
    }
  </style>
</head>

<body>
  <div id="adminRoot"></div>

  <script>
    const root = document.getElementById('adminRoot');

    if (window.location.protocol === 'file:') {
      const deployHint = 'https://YOUR_NETLIFY_DOMAIN/admin';
      root.innerHTML = `
        <div class="admin-msg">
          <h1>Use Netlify URL for Admin</h1>
          <p>This admin panel cannot run from a local file path.</p>
          <p>Open it from your deployed site URL using <strong>/admin</strong>.</p>
          <ol>
            <li>Deploy/publish to Netlify</li>
            <li>Enable Netlify Identity and Git Gateway</li>
            <li>Open ${deployHint}</li>
            <li>Sign in with invited account only</li>
          </ol>
        </div>
      `;
    } else {
      const identity = document.createElement('script');
      identity.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
      identity.defer = true;
      document.body.appendChild(identity);

      const cms = document.createElement('script');
      cms.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      cms.defer = true;
      document.body.appendChild(cms);
    }
  </script>
</body>

</html>
