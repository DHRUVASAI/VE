backend:
  name: github
  repo: DHRUVASAI/VE
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "services_gallery"
    label: "Our Specialized Services Gallery"
    files:
      - name: "services_gallery_file"
        label: "Category-wise Gallery"
        file: "data/services-gallery.json"
        format: "json"
        fields:
          - label: "Industrial"
            name: "industrial"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", default: "Industrial Uniforms" }
              - { label: "Icon (Font Awesome class)", name: "icon", widget: "string", default: "fa-industry" }
              - label: "Images"
                name: "images"
                widget: "list"
                summary: "{{fields.caption}}"
                hint: "Upload transparent PNG/WebP (recommended) for no-background look."
                fields:
                  - { label: "Media (Image/Video)", name: "src", widget: "file" }
                  - { label: "Caption", name: "caption", widget: "string" }
          - label: "Healthcare"
            name: "healthcare"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", default: "Healthcare Wear" }
